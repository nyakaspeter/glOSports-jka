// GA36-MB gamepad bindings: part of the defaults, run right after default.cfg
// (at startup and on a settings reset); base/openjk_sp.cfg keeps any changes.
// sdl_glospad.cpp sends the pad's buttons as JOY keys in SDL's button order,
// positions as on an Xbox pad. Sticks: left moves, right aims. Start opens the menu.
bind JOY1  +moveup           // A: jump
bind JOY2  +movedown         // B: crouch
bind JOY3  +use              // X: use
bind JOY4  weapnext          // Y: next weapon
bind JOY5  datapad           // Select: datapad (objectives, force powers)
bind JOY8  +speed            // L3: walk
bind JOY9  "toggle cg_thirdPerson"  // R3: first/third person
bind JOY10 forcenext         // L1: next force power
bind JOY11 +useforce         // R1: use force power
bind JOY12 saberAttackCycle  // d-pad up: saber style
bind JOY13 invuse            // d-pad down: use item
bind JOY14 weapprev          // d-pad left: previous weapon
bind JOY15 invnext           // d-pad right: next item
bind JOY16 +altattack        // L2: alternate fire / saber throw
bind JOY17 +attack           // R2: fire / swing
